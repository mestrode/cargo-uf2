[package]
name = "cargo-uf2"
version = "0.2.0"
edition = "2024"
description = "A cargo subcommand for UF2 file operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mestrode/cargo-uf2"
authors = ["mestrode <35630715+mestrode@users.noreply.github.com>"]
keywords = ["uf2", "embedded", "flash", "firmware"]
categories = ["development-tools::cargo-plugins", "embedded", "hardware-support"]
readme = "README.md"
include = [
    "data/**/*",
    "src/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
uftwo = { version = "0.3.0", features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
clap-num = "1.2.0"
anyhow = "1.0.103"
serde_json = "1.0.150"
zerocopy = { version = "0.8.54", features = ["derive"] }
bitflags = "2.13.0"
md5 = "0.8.1"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
